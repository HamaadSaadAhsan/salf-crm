name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test SSH Connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          debug: true
          script: |
            echo "✅ SSH connection successful!"
            echo "Current user: $(whoami)"
            echo "Current directory: $(pwd)"
            echo "Server hostname: $(hostname)"
            echo "PHP version: $(php8.4 -v | head -n 1)"
            echo "Node version: $(node -v)"
            echo "NPM version: $(npm -v)"
            echo "Composer version: $(php8.4 $(which composer) --version)"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          debug: true
          script: |
            echo "📂 Navigating to project directory..."
            cd ${{ secrets.SERVER_PATH }}
            echo "✅ Current directory: $(pwd)"

            echo ""
            echo "🔄 Pulling latest changes from main..."
            git fetch origin main
            echo "✅ Git fetch completed"
            # git reset --hard origin/main

            echo ""
            echo "📦 Installing PHP dependencies..."
            php8.4 $(which composer) install --no-interaction --prefer-dist --optimize-autoloader --no-dev
            echo "✅ Composer install completed"

            echo ""
            echo "📦 Installing Node dependencies and building assets..."
            npm ci && npm run build
            echo "✅ NPM build completed"
            # npm run build:ssr

            echo ""
            echo "🔗 Creating storage symlink..."
            php8.4 artisan storage:link
            echo "✅ Storage link created"

            echo ""
            echo "🗄️ Running database migrations..."
            php8.4 artisan migrate --force
            echo "✅ Migrations completed"

            echo ""
            echo "⚡ Optimizing application..."
            php8.4 artisan optimize
            echo "✅ Optimization completed"
            # php artisan optimize:clear
            # php artisan config:cache
            # php artisan route:cache
            php artisan cache:clear

            echo ""
            echo "🎉 Deployment completed successfully!"
            # Restart Laravel Horizon (queue workers)
            # php artisan horizon:terminate

            # Restart Laravel Reverb (WebSocket server)
            # php artisan reverb:restart

            # Set proper permissions
            # chmod -R 775 storage bootstrap/cache
