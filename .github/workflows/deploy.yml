name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd ${{ secrets.SERVER_PATH }}

            # Pull latest changes
            git fetch origin main
            # git reset --hard origin/main

            # Install PHP dependencies
            php8.4 $(which composer) install --no-interaction --prefer-dist --optimize-autoloader --no-dev

            # Install Node dependencies and build assets
            npm ci && npm run build
            # npm run build:ssr

            php8.4 artisan storage:link

            # Run database migrations
            php8.4 artisan migrate --force

            # Clear and optimize caches
            # php artisan optimize:clear
            # php artisan config:cache
            # php artisan route:cache
            # php artisan view:cache
            php8.4 artisan optimize

            # Restart Laravel Horizon (queue workers)
            # php artisan horizon:terminate

            # Restart Laravel Reverb (WebSocket server)
            # php artisan reverb:restart

            # Set proper permissions
            # chmod -R 775 storage bootstrap/cache
